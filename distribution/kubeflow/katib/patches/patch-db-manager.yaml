# This patches the katib-db-manager to use katib-rds-secret and katib-rds-config parameters needed to connect to the RDS database
apiVersion: apps/v1
kind: Deployment
metadata:
  name: katib-db-manager
  namespace: kubeflow
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: katib-db-manager
        image: kubeflowkatib/katib-db-manager:v1beta1-9caa8bc@sha256:933c68496dd16a59cfae7f81c5253d384b4dbfe8ff1749be641aa06101aaa79c
        env:
        - name: DB_NAME
          value: mysql
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              key: RDS_USERNAME
              name: katib-rds-secret
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: RDS_PASSWORD
              name: katib-rds-secret
        - name: KATIB_MYSQL_DB_DATABASE
          valueFrom:
            configMapKeyRef:
              key: DB_NAME
              name: katib-rds-config
            secretKeyRef:
              $patch: delete
              key: KATIB_MYSQL_DB_DATABASE
              name: katib-mysql-secrets-th9dkf48dg
        - name: KATIB_MYSQL_DB_HOST
          valueFrom:
            configMapKeyRef:
              key: RDS_HOST
              name: katib-rds-config
            secretKeyRef:
              $patch: delete
              key: KATIB_MYSQL_DB_HOST
              name: katib-mysql-secrets-th9dkf48dg
        - name: KATIB_MYSQL_DB_PORT
          valueFrom:
            configMapKeyRef:
              key: RDS_PORT
              name: katib-rds-config
            secretKeyRef:
              $patch: delete
              key: KATIB_MYSQL_DB_PORT
              name: katib-mysql-secrets-th9dkf48dg
